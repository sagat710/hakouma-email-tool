name: hakouma_mail
description: Hakouma Mail - AI-powered multi-account email client for Japanese business users.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Email protocols
  enough_mail: ^2.3.0

  # State management & navigation
  flutter_riverpod: ^2.3.6
  go_router: ^12.1.3

  # Local database (SQLite via Drift)
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.1
  path: ^1.9.0

  # Secure credential storage
  flutter_secure_storage: ^9.0.0

  # HTML email rendering
  flutter_widget_from_html_core: ^0.10.3

  # UI widgets
  intl: '>=0.17.0 <1.0.0'
  shimmer: ^3.0.0
  file_picker: ^6.1.1
  flutter_slidable: ^3.0.0

  # Utilities
  uuid: ^4.3.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  drift_dev: ^2.14.1
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
