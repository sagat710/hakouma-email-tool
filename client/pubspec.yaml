name: hakouma_mail
description: Hakouma Mail - AI-powered multi-account email client for Japanese business users.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Email protocols
  enough_mail: ^2.4.0

  # State management & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^13.0.0

  # Local database (SQLite via Drift)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.0
  path: ^1.9.0

  # Secure credential storage (Keychain / Keystore / EncryptedSharedPrefs)
  flutter_secure_storage: ^9.0.0

  # HTML email rendering (Dart 3 compatible)
  flutter_widget_from_html: ^0.15.0

  # Push notifications
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^16.3.0

  # UI widgets
  intl: ^0.19.0
  shimmer: ^3.0.0
  file_picker: ^5.5.0
  flutter_slidable: ^3.0.0

  # Utilities
  uuid: ^4.3.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.18.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
