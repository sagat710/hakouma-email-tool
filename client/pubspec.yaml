name: hakouma_mail
description: Hakouma Mail - AI-powered multi-account email client for Japanese business users.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Email protocol (IMAP / SMTP / POP3)
  enough_mail: ^2.4.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Local database (SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure credential storage (Keychain / Keystore)
  flutter_secure_storage: ^9.2.1

  # E2E encryption (XChaCha20-Poly1305 + Argon2id)
  cryptography: ^2.7.0

  # HTTP / WebSocket
  http: ^1.2.2
  web_socket_channel: ^3.0.1

  # Google OAuth + APIs (Tasks, Calendar, Gmail)
  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  googleapis_auth: ^1.6.0

  # HTML email rendering
  flutter_html: ^3.0.0-beta.2
  html: ^0.15.4

  # Push notifications
  firebase_messaging: ^15.1.2
  flutter_local_notifications: ^17.2.2

  # UI utilities
  intl: ^0.19.0
  timeago: ^3.6.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  file_picker: ^8.1.2
  open_filex: ^4.4.0
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  flutter_slidable: ^3.1.0
  badges: ^3.1.2

  # Naive Bayes spam classifier (local ML)
  collection: ^1.18.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/
