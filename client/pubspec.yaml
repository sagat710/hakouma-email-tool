name: hakouma_mail
description: Hakouma Mail - AI-powered multi-account email client for Japanese business users.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Email protocols
  enough_mail: '>=2.0.0 <3.0.0'

  # State management & navigation
  flutter_riverpod: '>=2.0.0 <3.0.0'
  go_router: '>=12.0.0 <15.0.0'

  # Local database (SQLite via Drift)
  drift: '>=2.14.0 <3.0.0'
  sqlite3_flutter_libs: '>=0.5.0 <1.0.0'
  path_provider: '>=2.0.0 <3.0.0'
  path: '>=1.8.0 <2.0.0'

  # Secure credential storage
  flutter_secure_storage: '>=8.0.0 <11.0.0'

  # HTML email rendering
  flutter_widget_from_html: '>=0.14.0 <1.0.0'

  # UI widgets
  intl: '>=0.17.0 <1.0.0'
  shimmer: '>=2.0.0 <4.0.0'
  file_picker: '>=5.0.0 <10.0.0'
  flutter_slidable: '>=3.0.0 <4.0.0'

  # Utilities
  uuid: '>=3.0.0 <5.0.0'
  shared_preferences: '>=2.0.0 <3.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <5.0.0'
  build_runner: '>=2.4.0 <4.0.0'
  drift_dev: '>=2.14.0 <3.0.0'
  mocktail: '>=1.0.0 <2.0.0'

flutter:
  uses-material-design: true
